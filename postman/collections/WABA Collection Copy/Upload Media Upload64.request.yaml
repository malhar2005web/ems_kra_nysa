$kind: http-request
description: This request uploads an image as .jpeg. The parameters are specified as **form-data** in the request **body**.
url: https://messagingapi.charteredinfo.com/v19.0/{{Phone-Number-ID}}/Media/UploadB64
method: POST
headers:
  Authorization: Bearer {{Auth}}
  Content-Type: application/json
body:
  type: text
  content: "{\r

    \  \"fileName\": \"refernce.pdf\",\r

    \  \"mimeType\": \"application/pdf\",\r

    \  \"b64OfMedia\": \"\"\r

    }"
settings:
  disabledSystemHeaders:
    - content-type
examples: ./.resources/Upload Media Upload64.resources/examples
order: 3000
